<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول مدير النظام (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <h2 class="text-2xl font-bold text-center text-[#002B49] mb-6">تسجيل دخول مدير النظام (Admin)</h2>

        <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني:</label>
                <input type="email" id="email" value="admin@school.com" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#002B49] focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور:</label>
                <input type="password" id="password" value="123456" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#002B49] focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-[#002B49] text-white py-2.5 rounded-lg font-bold hover:bg-opacity-90 transition cursor-pointer mt-2">
                تسجيل الدخول
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-gray-500 hover:text-gray-800 transition">← العودة للرئيسية</a>
        </div>
    </div>

    <script>
        function handleAdminLogin(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            // قبول الحساب الافتراضي للأدمن
            if ((emailInput === 'abdulaziz.alfay3@gmail.com' || emailInput === '3alfayi@gmail.com') && (passwordInput === 'ABDulaziz@2030' || passwordInput === 'AYM.azoz172')) {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin_dashboard.html';
            } else {
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
            }
        }
    </script>
</body>
</html>

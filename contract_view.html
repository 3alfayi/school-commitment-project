<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة الالتزام المدرسي والزي الرسمي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-6 font-sans text-gray-800">

    <!-- أزرار التحكم -->
    <div class="max-w-3xl mx-auto mb-4 flex justify-between items-center no-print">
        <button onclick="window.close()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-1.5 rounded shadow text-sm">
            إغلاق النافذة
        </button>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded shadow text-sm font-bold flex items-center gap-2">
            🖨️ طباعة الاستمارة
        </button>
    </div>

    <!-- رسالة التحميل -->
    <div id="loading" class="text-center py-20 text-gray-600 text-lg font-bold">جاري تحميل استمارة الطالب...</div>

    <!-- بطاقة الورقة الأصلية -->
    <div id="contract-card" class="hidden max-w-3xl mx-auto bg-white p-6 md:p-8 rounded border border-gray-300 print-container text-xs md:text-sm">
        
        <!-- الترويسة الرسمية -->
        <div class="text-center border-b border-dashed border-gray-400 pb-3 mb-4">
            <h2 class="text-sm font-bold text-gray-700">المملكة العربية السعودية - وزارة التعليم</h2>
            <p id="school-header" class="text-xs text-gray-600 font-medium">الإدارة العامة للتعليم بمحافظة عسير</p>
            <h1 class="text-lg md:text-xl font-extrabold text-blue-900 mt-2">استمارة الالتزام المدرسي والزي الرسمي 1448هـ</h1>
        </div>

         student.html
    <!-- السكريبت المباشر لجلب البيانات -->
    <script>
        const SUPABASE_URL = 'https://fpfsdqgmtgeetwecxtpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwZnNkcWdtdGdlZXR3ZWN4dHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODk0NzYsImV4cCI6MjEwMjU2NTQ3Nn0.ofEm1s2OyFeey7D9ps_DtM4srB2Bt3qLEFkCp_q5VHo';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchExactStudentPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('id');

            if (!studentId) {
                document.getElementById('loading').innerText = 'خطأ: لم يتم تحديد الطالب!';
                return;
            }

            try {
                // جلب الطالب مع ربط قاعدة بيانات المدرسة
                const { data: student, error } = await supabaseClient
                    .from('students')
                    .select('*, schools(*)')
                    .eq('id', studentId)
                    .single();

                if (error || !student) {
                    document.getElementById('loading').innerText = 'تعذر تحميل استمارة الطالب المطلوبة.';
                    console.error(error);
                    return;
                }

                // 1. الترويسة واسم المدرسة واسم مدير المدرسة
                const schoolData = student.schools || {};
                const schoolName = schoolData.school_name || schoolData.name || 'أبولعاص';
                const eduDept = schoolData.education_dept || schoolData.region || 'محافظة عسير';
                
                document.getElementById('school-header').innerText = `الإدارة العامة للتعليم بـ ${eduDept} | مدرسة ${schoolName}`;

                // تحديد اسم مدير المدرسة بمرونة (من الجدول أو LocalStorage كبديل)
                const managerName = schoolData.principal_name || schoolData.manager_name || localStorage.getItem('principalName') || '-';
                document.getElementById('school-manager').innerText = managerName;

                // عرض توقيع مدير المدرسة إذا كان مفعلاً
                if (schoolData.reflect_signature && schoolData.signature_url) {
                    const schoolSigImg = document.getElementById('school-sig-img');
                    schoolSigImg.src = schoolData.signature_url;
                    document.getElementById('school-sig-box').classList.remove('hidden');
                }

                // 2. بيانات الطالب
                document.getElementById('student-name').innerText = student.student_name || student.name || '-';
                document.getElementById('grade-stage').innerText = student.grade_and_stage || student.grade || '-';

                // 3. بيانات ولي الأمر
                document.getElementById('parent-name').innerText = student.parent_name || '-';
                document.getElementById('parent-job').innerText = student.parent_job || '-';
                document.getElementById('parent-phone').innerText = student.parent_phone || student.phone || '0000000000';
                document.getElementById('parent-phone-extra').innerText = student.parent_phone_extra || '-';

                // 4. التاريخ
                const dateStr = student.signed_at || student.created_at || '1446هـ';
                document.getElementById('student-sig-date').innerText = dateStr;
                document.getElementById('parent-sig-date').innerText = dateStr;

                // 5. التوقيعات (الطالب وولي الأمر)
                const studentSig = student.student_signature || student.signature_url;
                if (studentSig && studentSig.length > 20) {
                    const studentImg = document.getElementById('student-sig-img');
                    studentImg.src = studentSig;
                    studentImg.classList.remove('hidden');
                    document.getElementById('no-student-sig').classList.add('hidden');
                }

                const parentSig = student.parent_signature || student.signature;
                if (parentSig && parentSig.length > 20) {
                    const parentImg = document.getElementById('parent-sig-img');
                    parentImg.src = parentSig;
                    parentImg.classList.remove('hidden');
                    document.getElementById('no-parent-sig').classList.add('hidden');
                }

                // عرض الصفحة
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('contract-card').classList.remove('hidden');

                // طباعة تلقائية عند فتح الرابط ببارامتر الطباعة
                if (urlParams.get('print') === 'true') {
                    setTimeout(() => window.print(), 800);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'حدث خطأ غير متوقع أثناء تحميل البيانات.';
            }
        }

        window.addEventListener('DOMContentLoaded', fetchExactStudentPage);
    </script>
</body>
</html>
